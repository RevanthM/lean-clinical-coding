<svg xmlns="http://www.w3.org/2000/svg" width="960" height="316" viewBox="0 0 960 316" role="img" aria-labelledby="title desc">
<title id="title">Figure 2. Interpretation remains outside the checked kernel</title>
<desc id="desc">The transition from a record to reviewed annotations is the principal unresolved semantic boundary. The figure distinguishes an assumed annotation process from the implemented certificate checks. [5,6,9]</desc>
<rect width="960" height="100%" rx="12" fill="#111e1b"/>
<style>text{font-family:Arial,Helvetica,sans-serif}.label{fill:#f4f2ec;font-size:19px;font-weight:600}.detail{fill:#b5c4bc;font-size:16px}.num{fill:#ff8a62;font-size:14px;font-weight:700}</style>
<rect x="26" y="20" width="436" height="120" rx="7" fill="#182d26" stroke="#52685d"/>
<text class="num" x="44" y="49">01</text>
<text class="label" x="78" y="50">Clinical record</text>
<text class="detail" x="44" y="84">Actual meaning, patient attribution, context,</text>
<text class="detail" x="44" y="104">and complete-record relevance.</text>
<path d="M 469 80 h 21 m -7 -6 l 7 6 -7 6" fill="none" stroke="#ff8a62" stroke-width="2"/>
<rect x="498" y="20" width="436" height="120" rx="7" fill="#182d26" stroke="#52685d"/>
<text class="num" x="516" y="49">02</text>
<text class="label" x="550" y="50">External review</text>
<text class="detail" x="516" y="84">Produces structured concept, certainty,</text>
<text class="detail" x="516" y="104">temporality, and setting annotations.</text>
<rect x="26" y="162" width="436" height="120" rx="7" fill="#182d26" stroke="#52685d"/>
<text class="num" x="44" y="191">03</text>
<text class="label" x="78" y="192">Frozen reviewed input</text>
<text class="detail" x="44" y="226">The assumptions Lean receives; their semantic</text>
<text class="detail" x="44" y="246">correctness is not proved.</text>
<path d="M 469 222 h 21 m -7 -6 l 7 6 -7 6" fill="none" stroke="#ff8a62" stroke-width="2"/>
<rect x="498" y="162" width="436" height="120" rx="7" fill="#182d26" stroke="#52685d"/>
<text class="num" x="516" y="191">04</text>
<text class="label" x="550" y="192">Certificate verification</text>
<text class="detail" x="516" y="226">Checks relationships among these fixed inputs</text>
<text class="detail" x="516" y="246">and the candidate.</text>
</svg>

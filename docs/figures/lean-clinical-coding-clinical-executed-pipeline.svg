<svg xmlns="http://www.w3.org/2000/svg" width="960" height="316" viewBox="0 0 960 316" role="img" aria-labelledby="title desc">
<title id="title">Figure 1. The executed clinical certificate path</title>
<desc id="desc">This is the implemented dataflow in the pinned source, not a deployed clinical workflow. The review step is an upstream assumption; no neural extractor or clinical adjudication service runs in the artifact. [9,10]</desc>
<rect width="960" height="100%" rx="12" fill="#111e1b"/>
<style>text{font-family:Arial,Helvetica,sans-serif}.label{fill:#f4f2ec;font-size:19px;font-weight:600}.detail{fill:#b5c4bc;font-size:16px}.num{fill:#ff8a62;font-size:14px;font-weight:700}</style>
<rect x="26" y="20" width="436" height="120" rx="7" fill="#182d26" stroke="#52685d"/>
<text class="num" x="44" y="49">01</text>
<text class="label" x="78" y="50">Reviewed note</text>
<text class="detail" x="44" y="84">Text plus externally reviewed concept,</text>
<text class="detail" x="44" y="104">certainty, setting, and current-encounter flag.</text>
<path d="M 469 80 h 21 m -7 -6 l 7 6 -7 6" fill="none" stroke="#ff8a62" stroke-width="2"/>
<rect x="498" y="20" width="436" height="120" rx="7" fill="#182d26" stroke="#52685d"/>
<text class="num" x="516" y="49">02</text>
<text class="label" x="550" y="50">Candidate certificate</text>
<text class="detail" x="516" y="84">Note ID, fixture revision, proposed concept,</text>
<text class="detail" x="516" y="104">quote, and scalar-value offset.</text>
<rect x="26" y="162" width="436" height="120" rx="7" fill="#182d26" stroke="#52685d"/>
<text class="num" x="44" y="191">03</text>
<text class="label" x="78" y="192">Lean predicate</text>
<text class="detail" x="44" y="226">Identity, annotation, applicability, bounds, and</text>
<text class="detail" x="44" y="246">exact phrase checks.</text>
<path d="M 469 222 h 21 m -7 -6 l 7 6 -7 6" fill="none" stroke="#ff8a62" stroke-width="2"/>
<rect x="498" y="162" width="436" height="120" rx="7" fill="#182d26" stroke="#52685d"/>
<text class="num" x="516" y="191">04</text>
<text class="label" x="550" y="192">Optional identifier</text>
<text class="detail" x="516" y="226">A supported illustrative code on success; none</text>
<text class="detail" x="516" y="246">on any failed condition.</text>
</svg>
